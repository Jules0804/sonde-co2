<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .bg{fill:#f4f7fb}.card{fill:#fff;stroke:#9daec2;stroke-width:2;rx:18}
      .title{font:700 30px Arial,sans-serif;fill:#142033}.sub{font:16px Arial,sans-serif;fill:#526273}
      .h{font:700 19px Arial,sans-serif;fill:#142033}.txt{font:15px Arial,sans-serif;fill:#243247}.small{font:13px Arial,sans-serif;fill:#526273}
      .mono{font:14px Consolas,monospace;fill:#142033}.white{font:700 17px Arial,sans-serif;fill:#fff}
      .pcbW{fill:#8e24aa;stroke:#4a1260;stroke-width:3;rx:20}.pcbS{fill:#111;stroke:#000;stroke-width:3;rx:14}.pcbD{fill:#111;stroke:#000;stroke-width:3;rx:14}
      .hole{fill:#fbfbf2;stroke:#6f5d16;stroke-width:3}.holeSel{fill:#fffde7;stroke:#ff6f00;stroke-width:5}
      .term{fill:#51b95b;stroke:#155d22;stroke-width:2;rx:5}.socket{fill:#f8f1df;stroke:#8c7c61;stroke-width:2;rx:5}
      .chip{fill:#4e4e4e;stroke:#222;stroke-width:2;rx:4}.sensor{fill:#e5ecff;stroke:#78909c;stroke-width:2;rx:5}
      .red{stroke:#e53935;stroke-width:8;fill:none}.black{stroke:#222;stroke-width:8;fill:none}.green{stroke:#00a651;stroke-width:8;fill:none}.blue{stroke:#1e88e5;stroke-width:8;fill:none}.orange{stroke:#fb8c00;stroke-width:8;fill:none}
      .thin{stroke-width:4}.dash{stroke-dasharray:13 9}.warn{fill:#fff8e1;stroke:#f9a825;stroke-width:2;rx:14}
    </style>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#e53935"/></marker>
    <marker id="ak" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#222"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#00a651"/></marker>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#1e88e5"/></marker>
    <marker id="ao" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#fb8c00"/></marker>
  </defs>

  <rect width="1800" height="1100" class="bg"/>
  <text x="50" y="60" class="title">Schéma atelier corrigé — câblage réel Wemos S2 Mini + SEN0536 + DFR0971</text>
  <text x="50" y="92" class="sub">Vue composants avec doubles rangées de broches Wemos, connecteurs Gravity, bornier 0-10 V et switchs d’adresse. Fichier vérifié XML.</text>

  <rect x="40" y="125" width="585" height="840" class="card"/>
  <text x="70" y="165" class="h">U1 — Wemos S2 Mini V1.0.0, vue face dessus USB en bas</text>
  <text x="70" y="190" class="small">La carte a 4 colonnes de trous : 2 à gauche, 2 à droite. Chaque nombre correspond à une vraie broche.</text>

  <rect x="230" y="235" width="270" height="560" class="pcbW"/>
  <rect x="315" y="735" width="100" height="45" fill="#5f6368" rx="8"/>
  <text x="335" y="763" class="small" fill="#fff">USB-C</text>
  <rect x="310" y="455" width="112" height="112" class="chip"/>
  <text x="335" y="515" class="white">ESP32-S2</text>
  <text x="322" y="620" class="white">S2 Mini</text>

  <!-- Wemos left double header: outer green column and inner blue column from official pin image -->
  <g id="wemos-left">
    <text x="90" y="260" class="mono">EN</text><circle cx="245" cy="255" r="11" class="hole"/>
    <text x="90" y="310" class="mono">3</text><circle cx="245" cy="305" r="11" class="hole"/>
    <text x="90" y="360" class="mono">5</text><circle cx="245" cy="355" r="11" class="hole"/>
    <text x="90" y="410" class="mono">7</text><circle cx="245" cy="405" r="11" class="hole"/>
    <text x="90" y="460" class="mono">9</text><circle cx="245" cy="455" r="11" class="hole"/>
    <text x="90" y="510" class="mono">11</text><circle cx="245" cy="505" r="11" class="hole"/>
    <text x="90" y="560" class="mono">12</text><circle cx="245" cy="555" r="11" class="hole"/>
    <text x="75" y="610" class="mono">3V3</text><circle cx="245" cy="605" r="12" class="holeSel"/>

    <text x="170" y="260" class="mono">1</text><circle cx="288" cy="255" r="11" class="hole"/>
    <text x="170" y="310" class="mono">2</text><circle cx="288" cy="305" r="11" class="hole"/>
    <text x="170" y="360" class="mono">4</text><circle cx="288" cy="355" r="11" class="hole"/>
    <text x="170" y="410" class="mono">6</text><circle cx="288" cy="405" r="11" class="hole"/>
    <text x="170" y="460" class="mono">8</text><circle cx="288" cy="455" r="11" class="hole"/>
    <text x="164" y="510" class="mono">10</text><circle cx="288" cy="505" r="11" class="hole"/>
    <text x="164" y="560" class="mono">13</text><circle cx="288" cy="555" r="11" class="hole"/>
    <text x="164" y="610" class="mono">14</text><circle cx="288" cy="605" r="11" class="hole"/>
  </g>

  <!-- Wemos right double header: inner blue column and outer green/red column from official pin image -->
  <g id="wemos-right">
    <text x="520" y="260" class="mono">40</text><circle cx="442" cy="255" r="11" class="hole"/>
    <text x="520" y="310" class="mono">38</text><circle cx="442" cy="305" r="11" class="hole"/>
    <text x="520" y="360" class="mono">36</text><circle cx="442" cy="355" r="11" class="hole"/>
    <text x="520" y="410" class="mono">34</text><circle cx="442" cy="405" r="11" class="hole"/>
    <text x="520" y="460" class="mono">21</text><circle cx="442" cy="455" r="12" class="holeSel"/>
    <text x="520" y="510" class="mono">17</text><circle cx="442" cy="505" r="11" class="hole"/>
    <text x="512" y="560" class="mono">GND</text><circle cx="442" cy="555" r="12" class="holeSel"/>
    <text x="520" y="610" class="mono">15</text><circle cx="442" cy="605" r="12" class="holeSel"/>

    <text x="575" y="260" class="mono">39</text><circle cx="485" cy="255" r="11" class="hole"/>
    <text x="575" y="310" class="mono">37</text><circle cx="485" cy="305" r="11" class="hole"/>
    <text x="575" y="360" class="mono">35</text><circle cx="485" cy="355" r="11" class="hole"/>
    <text x="575" y="410" class="mono">33</text><circle cx="485" cy="405" r="11" class="hole"/>
    <text x="575" y="460" class="mono">18</text><circle cx="485" cy="455" r="11" class="hole"/>
    <text x="575" y="510" class="mono">16</text><circle cx="485" cy="505" r="11" class="hole"/>
    <text x="567" y="560" class="mono">GND</text><circle cx="485" cy="555" r="11" class="hole"/>
    <text x="558" y="610" class="mono">VBUS</text><circle cx="485" cy="605" r="11" class="hole"/>
  </g>

  <rect x="70" y="710" width="525" height="205" class="warn"/>
  <text x="95" y="745" class="h">Broches utilisées</text>
  <text x="95" y="780" class="mono">3V3  → trou 3V3, colonne extérieure gauche, dernière ligne</text>
  <text x="95" y="810" class="mono">GND  → trou GND, colonne intérieure droite, avant-dernière ligne</text>
  <text x="95" y="840" class="mono">SDA  → GPIO15, colonne intérieure droite, dernière ligne</text>
  <text x="95" y="870" class="mono">SCL  → GPIO21, colonne intérieure droite, ligne 21/18</text>
  <text x="95" y="900" class="small">Ne pas utiliser VBUS pour les modules I²C pendant ce test.</text>

  <rect x="690" y="125" width="430" height="360" class="card"/>
  <text x="720" y="165" class="h">U3 — Sonde CO₂ SEN0536 / SCD41</text>
  <text x="720" y="190" class="small">Vue inspirée de la sérigraphie DFRobot : connecteur blanc à gauche, ordre imprimé de haut en bas.</text>
  <rect x="790" y="245" width="250" height="150" class="pcbS"/>
  <rect x="812" y="280" width="55" height="84" class="socket"/>
  <rect x="922" y="282" width="70" height="70" class="sensor"/>
  <text x="933" y="322" class="mono">SCD41</text>
  <text x="878" y="288" class="mono" fill="#fff">SDA</text>
  <text x="878" y="313" class="mono" fill="#fff">SCL</text>
  <text x="878" y="338" class="mono" fill="#fff">GND</text>
  <text x="878" y="363" class="mono" fill="#fff">VCC</text>
  <circle cx="838" cy="285" r="6" class="holeSel"/>
  <circle cx="838" cy="310" r="6" class="holeSel"/>
  <circle cx="838" cy="335" r="6" class="holeSel"/>
  <circle cx="838" cy="360" r="6" class="holeSel"/>
  <text x="720" y="430" class="mono">Adresse attendue : 0x62</text>

  <rect x="1190" y="125" width="560" height="655" class="card"/>
  <text x="1220" y="165" class="h">U2 — DAC DFR0971 / GP8403 0-10 V</text>
  <text x="1220" y="190" class="small">Vue corrigée : bornier vert 3 points à gauche, Gravity I²C à droite, DIP A2/A1/A0.</text>
  <rect x="1315" y="245" width="310" height="345" class="pcbD"/>
  <text x="1398" y="410" class="white">DFR0971</text>
  <text x="1360" y="438" class="small" fill="#fff">I2C to 2 channels 0~10V</text>

  <!-- DAC output terminal, top to bottom per visible silkscreen: VOUT1, GND, VOUT0 -->
  <rect x="1265" y="315" width="72" height="210" class="term"/>
  <line x1="1265" y1="385" x2="1337" y2="385" stroke="#155d22" stroke-width="2"/>
  <line x1="1265" y1="455" x2="1337" y2="455" stroke="#155d22" stroke-width="2"/>
  <circle cx="1301" cy="350" r="10" fill="#e8e8e8" stroke="#777" stroke-width="2"/>
  <circle cx="1301" cy="420" r="10" fill="#e8e8e8" stroke="#777" stroke-width="2"/>
  <circle cx="1301" cy="490" r="10" fill="#e8e8e8" stroke="#777" stroke-width="2"/>
  <text x="1205" y="355" class="mono">VOUT1</text>
  <text x="1218" y="425" class="mono">GND</text>
  <text x="1205" y="495" class="mono">VOUT0</text>

  <!-- DAC Gravity input connector, + - C D. C=clock, D=data -->
  <rect x="1568" y="285" width="44" height="145" class="socket"/>
  <circle cx="1578" cy="310" r="5" class="holeSel"/><text x="1536" y="315" class="mono" fill="#fff">+</text>
  <circle cx="1578" cy="340" r="5" class="holeSel"/><text x="1536" y="345" class="mono" fill="#fff">-</text>
  <circle cx="1578" cy="370" r="5" class="holeSel"/><text x="1536" y="375" class="mono" fill="#fff">C</text>
  <circle cx="1578" cy="400" r="5" class="holeSel"/><text x="1536" y="405" class="mono" fill="#fff">D</text>
  <text x="1420" y="630" class="mono">+ = VCC   - = GND   C = SCL   D = SDA</text>

  <!-- Address DIP and table -->
  <rect x="1395" y="500" width="105" height="48" fill="#2c2c2c" stroke="#000" rx="4"/>
  <rect x="1404" y="508" width="22" height="32" fill="#ffb300"/><rect x="1434" y="508" width="22" height="32" fill="#ffb300"/><rect x="1464" y="508" width="22" height="32" fill="#ffb300"/>
  <text x="1398" y="565" class="mono" fill="#fff">A2 A1 A0</text>
  <text x="1220" y="675" class="mono">Adresse conservee sur le banc actuel : 0x5F</text>
  <text x="1220" y="705" class="small">La position physique 0/1 se confirme au scan I²C. Couper l’USB avant de déplacer les switchs.</text>

  <rect x="690" y="820" width="430" height="145" class="card"/>
  <text x="720" y="860" class="h">TP1 — Multimètre pour sortie 0-10 V</text>
  <text x="720" y="895" class="mono">Pointe rouge → VOUT0 du bornier vert</text>
  <text x="720" y="925" class="mono">Pointe noire → GND du bornier vert</text>
  <text x="720" y="950" class="small">La sortie 0-10 V ne retourne jamais vers une GPIO ESP32.</text>

  <!-- Wires from Wemos to sensor -->
  <path d="M245 605 C490 610,650 360,838 360" class="red thin" marker-end="url(#ar)"/>
  <path d="M442 555 C590 550,660 350,838 335" class="black thin" marker-end="url(#ak)"/>
  <path d="M442 605 C610 620,670 295,838 285" class="green thin" marker-end="url(#ag)"/>
  <path d="M442 455 C600 440,680 310,838 310" class="blue thin" marker-end="url(#ab)"/>

  <!-- Wires from Wemos to DAC Gravity connector -->
  <path d="M245 605 C700 695,1030 260,1578 310" class="red" marker-end="url(#ar)"/>
  <path d="M442 555 C790 650,1070 320,1578 340" class="black" marker-end="url(#ak)"/>
  <path d="M442 455 C820 430,1120 360,1578 370" class="blue" marker-end="url(#ab)"/>
  <path d="M442 605 C820 735,1120 410,1578 400" class="green" marker-end="url(#ag)"/>

  <!-- DAC output to multimeter -->
  <path d="M1301 490 C1220 720,1035 895,1120 895" class="orange" marker-end="url(#ao)"/>
  <path d="M1301 420 C1200 700,1020 925,1120 925" class="black dash" marker-end="url(#ak)"/>

  <rect x="50" y="1000" width="1700" height="62" class="warn"/>
  <text x="75" y="1028" class="h">Contrôle avant mise sous tension :</text>
  <text x="355" y="1028" class="txt">USB seul, modules en 3V3, aucune charge moteur. Scan attendu : DAC 0x5F + sonde 0x62.</text>
  <text x="355" y="1052" class="txt">Sur DFR0971 : Wemos SDA GPIO15 va sur D, Wemos SCL GPIO21 va sur C. Sur SEN0536 : suivre SDA/SCL/GND/VCC imprimé sur la carte.</text>
</svg>
