<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="780" viewBox="0 0 1300 780">
  <defs>
    <style>
      .title{font:700 28px Arial,sans-serif;fill:#172033}.subtitle{font:16px Arial,sans-serif;fill:#506070}
      .box-title{font:700 20px Arial,sans-serif;fill:#172033}.pin{font:15px Consolas,monospace;fill:#172033}
      .small{font:14px Arial,sans-serif;fill:#506070}.note{font:15px Arial,sans-serif;fill:#172033}
      .box{fill:#f7f9fc;stroke:#9aabc1;stroke-width:2;rx:18}.module{fill:#fff;stroke:#65758b;stroke-width:2;rx:14}
      .pinbox{fill:#eef3f9;stroke:#b5c1d1;stroke-width:1.5;rx:6}
      .vcc{stroke:#d93025;stroke-width:5;fill:none}.gnd{stroke:#30343b;stroke-width:5;fill:none}
      .sda{stroke:#0b8f4d;stroke-width:5;fill:none}.scl{stroke:#1a73e8;stroke-width:5;fill:none}
      .analog{stroke:#ff9800;stroke-width:5;fill:none}.dash{stroke-dasharray:10 8}
    </style>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d93025"/></marker>
    <marker id="ak" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#30343b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b8f4d"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1a73e8"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff9800"/></marker>
  </defs>
  <rect x="30" y="25" width="1240" height="730" class="box"/>
  <text x="60" y="70" class="title">Schéma de câblage lot 1 — Wemos S2 Mini, SEN0536 et DFR0971</text>
  <text x="60" y="100" class="subtitle">Bus I²C commun en 3,3 V — SDA GPIO15, SCL GPIO21 — adresses attendues : DFR0971 0x58, SEN0536/SCD41 0x62</text>
  <rect x="95" y="170" width="320" height="390" class="module"/><text x="125" y="210" class="box-title">U1 — Wemos S2 Mini</text><text x="125" y="236" class="small">Carte actuelle du banc</text>
  <rect x="135" y="280" width="150" height="34" class="pinbox"/><text x="150" y="303" class="pin">3V3</text>
  <rect x="135" y="330" width="150" height="34" class="pinbox"/><text x="150" y="353" class="pin">GND</text>
  <rect x="135" y="380" width="150" height="34" class="pinbox"/><text x="150" y="403" class="pin">GPIO15 / SDA</text>
  <rect x="135" y="430" width="150" height="34" class="pinbox"/><text x="150" y="453" class="pin">GPIO21 / SCL</text>
  <text x="125" y="515" class="small">USB uniquement pour alimenter/programmer.</text><text x="125" y="538" class="small">Ne pas injecter de 10 V vers la Wemos.</text>
  <rect x="830" y="145" width="330" height="225" class="module"/><text x="860" y="185" class="box-title">U3 — Sonde CO₂ SEN0536</text><text x="860" y="211" class="small">Capteur SCD41 — adresse I²C 0x62</text>
  <rect x="970" y="245" width="120" height="30" class="pinbox"/><text x="995" y="266" class="pin">VCC</text>
  <rect x="970" y="285" width="120" height="30" class="pinbox"/><text x="995" y="306" class="pin">GND</text>
  <rect x="970" y="325" width="120" height="30" class="pinbox"/><text x="995" y="346" class="pin">SDA</text>
  <rect x="970" y="365" width="120" height="30" class="pinbox"/><text x="995" y="386" class="pin">SCL</text>
  <rect x="830" y="450" width="330" height="230" class="module"/><text x="860" y="490" class="box-title">U2 — DAC DFR0971</text><text x="860" y="516" class="small">GP8403 0-10 V — adresse I²C 0x58</text>
  <rect x="970" y="545" width="120" height="30" class="pinbox"/><text x="995" y="566" class="pin">VCC</text>
  <rect x="970" y="585" width="120" height="30" class="pinbox"/><text x="995" y="606" class="pin">GND</text>
  <rect x="970" y="625" width="120" height="30" class="pinbox"/><text x="995" y="646" class="pin">SDA</text>
  <rect x="970" y="665" width="120" height="30" class="pinbox"/><text x="995" y="686" class="pin">SCL</text>
  <rect x="860" y="625" width="90" height="30" class="pinbox"/><text x="873" y="646" class="pin">VOUT0</text>
  <rect x="495" y="600" width="230" height="95" class="module"/><text x="525" y="637" class="box-title">TP1 — Multimètre</text><text x="525" y="664" class="small">Rouge sur VOUT0</text><text x="525" y="687" class="small">Noir sur GND commun</text>
  <path d="M285 297 C520 297,730 260,970 260" class="vcc" marker-end="url(#ar)"/><path d="M285 297 C520 297,730 560,970 560" class="vcc" marker-end="url(#ar)"/>
  <path d="M285 347 C520 347,720 300,970 300" class="gnd" marker-end="url(#ak)"/><path d="M285 347 C520 347,720 600,970 600" class="gnd" marker-end="url(#ak)"/>
  <path d="M285 397 C530 397,740 340,970 340" class="sda" marker-end="url(#ag)"/><path d="M285 397 C530 397,740 640,970 640" class="sda" marker-end="url(#ag)"/>
  <path d="M285 447 C530 447,740 380,970 380" class="scl" marker-end="url(#ab)"/><path d="M285 447 C530 447,740 680,970 680" class="scl" marker-end="url(#ab)"/>
  <path d="M860 640 C760 640,735 638,725 638" class="analog" marker-end="url(#ao)"/><path d="M970 600 C820 600,790 688,725 688" class="gnd dash" marker-end="url(#ak)"/>
  <rect x="80" y="620" width="360" height="78" fill="#fff8e1" stroke="#f0b429" stroke-width="2" rx="12"/><text x="105" y="650" class="note">Règle de sécurité prototype :</text><text x="105" y="675" class="small">sortie 0-10 V vers multimètre ou entrée moteur uniquement, jamais vers GPIO ESP32.</text>
  <rect x="500" y="170" width="245" height="150" fill="#eefaf2" stroke="#75b58a" stroke-width="2" rx="12"/><text x="525" y="205" class="box-title">Couleurs de fils</text>
  <line x1="525" y1="235" x2="575" y2="235" class="vcc"/><text x="590" y="241" class="small">Rouge : 3V3</text>
  <line x1="525" y1="260" x2="575" y2="260" class="gnd"/><text x="590" y="266" class="small">Noir : GND</text>
  <line x1="525" y1="285" x2="575" y2="285" class="sda"/><text x="590" y="291" class="small">Vert : SDA</text>
  <line x1="525" y1="310" x2="575" y2="310" class="scl"/><text x="590" y="316" class="small">Bleu : SCL</text>
</svg>
